<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IoT Water Monitoring</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">🔒</div>
            <h2>IoT WATER SYSTEM</h2>
            <p>Masukkan kredensial akun untuk mengakses sistem</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>USERNAME</label>
                <div class="input-box">
                    <input type="text" id="username" placeholder="Masukan Username" required autocomplete="off">
                </div>
            </div>

            <div class="form-group">
                <label>PASSWORD</label>
                <div class="input-box">
                    <input type="password" id="password" placeholder="Masukan Password" required>
                </div>
            </div>

            <button type="submit" class="btn-login">MASUK DASHBOARD</button>
            <div id="errorMsg" class="error-msg">⚠️ Username atau password salah!</div>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Akun sementara: user = admin, pass = 123
            if (user === "admin" && pass === "123") {
                localStorage.setItem('isLoggedIn', 'true');
                window.location.href = "dashboard.html";
            } else {
                const errorBox = document.getElementById('errorMsg');
                errorBox.style.display = "block";
            }
        }
    </script>
</body>
</html>
