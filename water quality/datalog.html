<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Log - IoT Water Monitoring</title>
    <link rel="stylesheet" href="water.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-brand"><h2>IoT SYSTEM</h2></div>
            <ul class="sidebar-menu">
                <li><a href="index.html">📊 Dashboard</a></li>
                <li class="active"><a href="datalog.html">📁 Data Log</a></li>
                <li><a href="analytics.html">📈 Analytics</a></li>

                <!-- Tambahkan baris ini di bagian bawah sidebar-menu sebelum </ul> -->
                <li style="margin-top: 40px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 15px;">
                    <a href="#" onclick="logoutUser()" style="color: #f87171;">🚪 Logout</a>
                </li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-title">RIWAYAT ARSIP DATA SENSOR (DATABASE)</div>
                <div class="header-right"><span id="liveClock" class="clock-badge">--</span></div>
            </header>

            <section class="dashboard-section">
                <h2 class="section-title">TABEL RIWAYAT DATA</h2>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Waktu (Timestamp)</th>
                                <th>TDS (ppm)</th>
                                <th>Suhu (°C)</th>
                                <th>EC (µS/cm)</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody">
                            
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>
    <script src="datalog.js"></script>
</body>
</html>
